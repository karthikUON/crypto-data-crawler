version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: crypto-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crypto_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - crypto-network

  # Crawler Service
  crawler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: crypto-crawler
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/crypto_db
      CRYPTO_API_URL: https://api.coingecko.com/api/v3
      CRAWLER_INTERVAL: 300
      TOP_N_CRYPTOS: 50
      MAX_RETRIES: 3
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m crawler.fetch_prices --continuous
    restart: unless-stopped
    networks:
      - crypto-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # API Service
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: crypto-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/crypto_db
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - crypto-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  crypto-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
